name: Release

# release-please owns the version number. It watches conventional commits on
# main, keeps a release pull request open with the pending changelog, and on
# merge tags the release. Publishing is a separate job gated on that tag, so a
# changelog-only run never republishes an artefact.
#
# The bump itself is decided upstream of this: the spec-sync workflow writes
# `feat!:` / `feat:` / `fix:` according to what oasdiff found on the consumed
# surface. See docs/versioning.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `issues: write` is needed alongside the other two: release-please
      # applies its `autorelease:` labels through the issues API, and label
      # writes on a pull request are an issues operation, not a pull-requests
      # one. Without it v5 reports `Resource not accessible by integration`
      # while creating the release.
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # The release pull request's number, taken from release-please itself
      # rather than rediscovered with a label query. Listing pull requests by
      # label goes through an index that lags creation by seconds, so the merge
      # job below saw "no pending release pull request" while the pull request
      # demonstrably existed — it merged on one repository and silently did
      # nothing on the other, purely on timing.
      release_pr: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).number || '' }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # As in spec-sync: with only the default token the release pull
          # request is created but runs no checks. Optional.
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}

  verify-release-pr:
    name: Verify the release pull request
    needs: release-please
    if: needs.release-please.outputs.release_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # GitHub does not execute workflow runs for a pull request opened with
      # the default GITHUB_TOKEN, so the release pull request cannot check
      # itself — its runs are created with no jobs and concluded red. The
      # verification therefore runs here, against the pull request's own head,
      # and the merge below is gated on this job succeeding. Merging a release
      # on the strength of a check that never executed is exactly what this
      # replaces.
      - name: Check out the release pull request's head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/pull/${{ needs.release-please.outputs.release_pr }}/head

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Check the vendored spec is canonical and matches its lock
        run: node tools/src/cli.mjs check

      - name: Test the spec pipeline
        run: npm ci --prefix tools && npm test --prefix tools

      - name: Build and test the Kotlin client
        working-directory: kotlin
        run: ./gradlew build --no-daemon

      - name: Build and test the TypeScript client
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Confirm the versions agree with what will be released
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # The whole point of the release pull request is the version bump, so
          # a mismatch here means release-please's extra-files stopped matching
          # and the wrong number is about to be published.
          set -euo pipefail
          gradle_version="$(sed -n 's/^version=\([^ ]*\).*/\1/p' kotlin/gradle.properties)"
          npm_version="$(node -p "require('./typescript/package.json').version")"
          echo "release-please=$VERSION gradle=$gradle_version npm=$npm_version"
          if [ -n "$VERSION" ] && { [ "$gradle_version" != "$VERSION" ] || [ "$npm_version" != "$VERSION" ]; }; then
            echo "::error::Version mismatch in the release pull request."
            exit 1
          fi

  merge-release-pr:
    name: Merge the release pull request
    needs: [release-please, verify-release-pr]
    # Only when release-please has a pending release; on the run that follows
    # the merge it has nothing to propose and this is skipped, which is what
    # stops the two workflows from cycling.
    if: needs.release-please.outputs.release_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge it
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ needs.release-please.outputs.release_pr }}
        run: |
          set -euo pipefail

          # Keeping the published clients in step with the upstream specs means
          # the release cannot wait for someone to press merge. The pull request
          # only ever changes version strings and the changelog — the code it
          # releases was already built and tested on main.
          #
          # This job runs only when release-please reported a pull request, so
          # "not found" is a failure rather than a quiet no-op. GitHub computes
          # mergeability asynchronously and reports UNKNOWN until it finishes,
          # so a merge attempted immediately after creation can be rejected;
          # hence the wait.
          for attempt in $(seq 1 20); do
            state="$(gh pr view "$NUMBER" --json state --jq '.state')"
            if [ "$state" = "MERGED" ]; then
              echo "::notice::Release pull request #$NUMBER is already merged."
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "::error::Release pull request #$NUMBER was closed without merging."
              exit 1
            fi

            mergeable="$(gh pr view "$NUMBER" --json mergeable --jq '.mergeable')"
            if [ "$mergeable" = "MERGEABLE" ]; then
              if gh pr merge "$NUMBER" --squash; then
                echo "::notice::Merged release pull request #$NUMBER; the next Release run publishes it."
                exit 0
              fi
              echo "Merge of #$NUMBER was rejected; retrying (attempt $attempt/20)."
            elif [ "$mergeable" = "CONFLICTING" ]; then
              echo "::error::Release pull request #$NUMBER has conflicts and needs a human."
              exit 1
            else
              echo "Mergeability of #$NUMBER is $mergeable; waiting (attempt $attempt/20)."
            fi
            sleep 10
          done

          echo "::error::Gave up waiting to merge release pull request #$NUMBER."
          exit 1

  publish:
    name: Publish to GitHub Packages
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@esa-blueshell'

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Confirm the tag carries the version being published
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # Both artefacts must agree with the tag. A mismatch means an
          # extra-files entry in release-please-config.json stopped matching,
          # which would otherwise publish a version nobody asked for.
          set -euo pipefail
          gradle_version="$(sed -n 's/^version=\([^ ]*\).*/\1/p' kotlin/gradle.properties)"
          npm_version="$(node -p "require('./typescript/package.json').version")"
          echo "tag=$VERSION gradle=$gradle_version npm=$npm_version"
          if [ "$gradle_version" != "$VERSION" ] || [ "$npm_version" != "$VERSION" ]; then
            echo "::error::Version mismatch between the release tag and the packages."
            exit 1
          fi

      - name: Publish the Kotlin client
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: kotlin
        run: ./gradlew publishMavenPublicationToGitHubPackagesRepository --no-daemon

      - name: Publish the TypeScript client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: typescript
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm publish

      - name: Summarise what was published
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          {
            echo "### Published \`$VERSION\`"
            echo
            echo '| Artefact | Coordinates |'
            echo '| --- | --- |'
            echo "| Maven | \`net.blueshell.clients:discord-client:$VERSION\` |"
            echo "| npm | \`@esa-blueshell/discord-client@$VERSION\` |"
            echo
            echo 'Both live in GitHub Packages, which requires a token to install even for public packages — see the README.'
          } >> "$GITHUB_STEP_SUMMARY"
