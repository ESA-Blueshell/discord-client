name: CI

# One job with many steps, not a job per language.
#
# GitHub bills Actions by the minute, rounded up per job, so a matrix of
# four-second jobs costs four minutes to do four seconds of work. Every step
# carries `if: ${{ !cancelled() }}` so a failure in the Kotlin build still lets
# the TypeScript results through — the reason a job-per-language split is
# normally reached for in the first place.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify spec, Kotlin and TypeScript
    # release-please and spec-sync open their pull requests with the default
    # GITHUB_TOKEN, and GitHub does not execute workflow runs for those: it
    # creates the run, allocates no job, and concludes it red. Skipping at the
    # job level makes the run conclude `skipped` instead, which is honest.
    #
    # This has to be a job-level `if` on head_ref. An `on.pull_request.branches-ignore`
    # filter matches the *base* branch, and these pull requests target main like
    # any other, so it excluded nothing at all.
    if: >-
      github.head_ref != 'release-please--branches--main' &&
      github.head_ref != 'chore/spec-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        if: ${{ !cancelled() }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        if: ${{ !cancelled() }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # ── The spec contract ────────────────────────────────────────────────
      # Runs first and is the cheapest gate: it catches a hand-edited spec, a
      # stale lock, or a spec carrying operations outside specs/surface.json,
      # any of which would make the released version number describe something
      # other than what shipped.
      - name: Check the vendored spec is canonical and matches its lock
        if: ${{ !cancelled() }}
        run: node tools/src/cli.mjs check

      - name: Install pipeline dependencies
        if: ${{ !cancelled() }}
        working-directory: tools
        run: npm ci

      - name: Test the spec pipeline
        if: ${{ !cancelled() }}
        working-directory: tools
        run: npm test

      # ── Kotlin client ───────────────────────────────────────────────────
      - name: Build and test the Kotlin client
        if: ${{ !cancelled() }}
        working-directory: kotlin
        run: ./gradlew build --no-daemon --stacktrace

      # ── TypeScript client ───────────────────────────────────────────────
      - name: Check both packages carry a well-formed version
        if: ${{ !cancelled() }}
        run: |
          # Seven releases were published as "0.2.x # x-release-please-version"
          # before anyone noticed: Java .properties has no trailing-comment
          # syntax, so release-please's marker became part of the value and
          # Gradle named every artefact after it. The version is asked of the
          # build rather than parsed out of the file, because parsing it is
          # what hid the problem.
          set -euo pipefail
          gradle_version="$(cd kotlin && ./gradlew -q printVersion --no-daemon | tail -1)"
          npm_version="$(node -p "require('./typescript/package.json').version")"
          echo "gradle=$gradle_version npm=$npm_version"
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          for pair in "gradle:$gradle_version" "npm:$npm_version"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if ! printf '%s' "$value" | grep -Eq "$semver"; then
              echo "::error::The $name version is not a bare semver string: '$value'"
              exit 1
            fi
          done
          if [ "$gradle_version" != "$npm_version" ]; then
            echo "::error::Gradle and npm versions disagree: '$gradle_version' vs '$npm_version'."
            exit 1
          fi

      - name: Install TypeScript dependencies
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: npm ci

      - name: Check the committed generated client is up to date
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: |
          # src/generated is committed so the nightly pull request shows the
          # real client diff a reviewer needs to judge a version bump. That only
          # holds if it is actually regenerated, so prove it reproduces.
          node ../tools/src/cli.mjs generator-input ../build/ts-generator-input.json
          npm run generate
          if ! git diff --quiet -- src/generated; then
            echo "::error::typescript/src/generated is stale. Run 'npm run generate' in typescript/ and commit the result."
            git diff --stat -- src/generated
            exit 1
          fi
          echo "Generated client is reproducible from specs/discord.json."

      - name: Typecheck the TypeScript client
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: npm run typecheck

      - name: Test the TypeScript client
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: npm test

      - name: Build the TypeScript package
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: npm run build

      - name: Confirm the built package loads as ESM
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: |
          # The generated sources import with extensionless, sometimes
          # directory-shaped specifiers, which TypeScript's `bundler` resolution
          # accepts and emits unchanged. Node then refuses the result:
          #
          #   ERR_UNSUPPORTED_DIR_IMPORT: Directory import '.../dist/generated/client'
          #
          # It shipped once already, because everything here tested the source
          # and nothing imported the build. Vite resolved it happily; vitest in
          # the consuming application did not.
          npm run verify:esm

      - name: Confirm the npm package contents
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: |
          # `files` in package.json is easy to get wrong, and the failure mode
          # is a published package that imports to nothing.
          npm pack --dry-run --json > pack.json
          node -e "
            const [pack] = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))
            const names = pack.files.map((f) => f.path)
            const required = ['dist/index.js', 'dist/index.d.ts', 'dist/generated/sdk.gen.js']
            const missing = required.filter((f) => !names.includes(f))
            if (missing.length) { console.error('Missing from the package tarball:', missing); process.exit(1) }
            console.log('Package contains', names.length, 'files including the built entry point.')
          "
