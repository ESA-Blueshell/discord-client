name: Dependency review

# Blocks a pull request that introduces a dependency with a known
# vulnerability, before it is merged rather than after Dependabot notices.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    # release-please and spec-sync open their pull requests with the default
    # GITHUB_TOKEN, and GitHub does not execute workflow runs for those: it
    # creates the run, allocates no job, and concludes it red. Skipping at the
    # job level makes the run conclude `skipped` instead, which is honest.
    #
    # This has to be a job-level `if` on head_ref. An `on.pull_request.branches-ignore`
    # filter matches the *base* branch, and these pull requests target main like
    # any other, so it excluded nothing at all.
    if: >-
      github.head_ref != 'release-please--branches--main' &&
      github.head_ref != 'chore/spec-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.6.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
