name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query pack still gets applied to code that
    # has not changed. Delivery is unreliable to the hour; that is fine here.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A job per language is unavoidable here: CodeQL builds one database per
        # language and the action does not accept several in one run.
        include:
          - language: javascript-typescript
          - language: java-kotlin
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.31.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build the Kotlin client
        if: matrix.language == 'java-kotlin'
        working-directory: kotlin
        run: ./gradlew classes --no-daemon

      - name: Perform the analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.31.2
        with:
          category: /language:${{ matrix.language }}
