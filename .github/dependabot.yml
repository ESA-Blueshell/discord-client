# Dependabot configuration.
#
# Mirrors the shape used in ESA-Blueshell/website, for the same reasons:
#
# Every ecosystem defines `groups`, and each group is declared twice — once for
# `version-updates` and once for `security-updates`. Grouping is what makes
# Dependabot fold a newly discovered update into the pull request that is
# already open instead of leaving a stale per-dependency PR behind: a grouped PR
# is rebuilt on every run, so the next bump joins the existing branch rather
# than being skipped once the open-PR limit is reached.
#
# Each ecosystem sets a 7-day `cooldown`: a freshly published release is not
# proposed until it has been on the registry for a week. This blunts
# supply-chain attacks that rely on a compromised version being pulled in
# immediately, leaving time for a malicious release to be yanked or flagged
# before it reaches a pull request here.
#
# Version-update groups carry only `minor` and `patch`. Majors are excluded so
# Dependabot raises one PR per major instead — a grouped PR mixing a breaking
# major with routine updates can never go green and blocks the safe updates
# behind it. Security-update groups are left unfiltered: a fix matters
# regardless of how the version moves.
version: 2

updates:
  # ── The spec pipeline (Node) ─────────────────────────────────────────────
  # Deliberately separate from the client package: this code decides release
  # version numbers, so its updates deserve to be reviewed on their own.
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      tools:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      tools-security:
        applies-to: security-updates
        patterns: ['*']

  # ── TypeScript client (npm) ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # TypeScript 7 is the native port and reshaped the compiler API. It removes
    # what `@hey-api/openapi-ts` reads at import time, so the generator dies
    # before it emits anything:
    #
    #   TypeError: Cannot read properties of undefined (reading 'AnyKeyword')
    #     at .../@hey-api/openapi-ts/dist/init-*.mjs
    #
    # openapi-ts 0.99.0 is the current release and does not support it yet.
    # Nothing in this repository can fix that, and an open pull request that
    # can never go green only hides the ones that can. Lift this once
    # openapi-ts declares support for typescript 7.
    ignore:
      - dependency-name: typescript
        versions: [">= 7"]
    groups:
      typescript:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      typescript-security:
        applies-to: security-updates
        patterns: ['*']

  # ── Kotlin client (Gradle) ───────────────────────────────────────────────
  - package-ecosystem: gradle
    directory: /kotlin
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      gradle:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      gradle-security:
        applies-to: security-updates
        patterns: ['*']

  # ── GitHub Actions ───────────────────────────────────────────────────────
  # Note: nothing in CI exercises release.yml, so an Actions major that breaks
  # releasing goes in green. release-please-action v5.0.0 did exactly that.
  # Actions are pinned by commit SHA in every workflow; Dependabot understands
  # those and bumps the SHA together with the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
